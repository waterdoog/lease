<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1200" height="690" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44546F"/></marker>
  </defs>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#172B4D">Lease — how it fits together</text>
  <text x="40" y="82" font-size="16" fill="#44546F">Agents claim Jira work and the files they will change before the first write. Everything server-side runs on Forge.</text>

  <!-- agents column -->
  <text x="40" y="128" font-size="14" font-weight="700" fill="#626F86" letter-spacing="1">CODING AGENTS</text>
  <g font-size="17" fill="#172B4D">
    <rect x="40" y="142" width="230" height="52" rx="10" fill="#F1F2F4" stroke="#C1C7D0"/><text x="60" y="174">Claude Code</text>
    <rect x="40" y="206" width="230" height="52" rx="10" fill="#F1F2F4" stroke="#C1C7D0"/><text x="60" y="238">Codex</text>
    <rect x="40" y="270" width="230" height="52" rx="10" fill="#F1F2F4" stroke="#C1C7D0"/><text x="60" y="302">Cursor / any MCP client</text>
  </g>
  <rect x="40" y="352" width="230" height="96" rx="10" fill="#FFF7D6" stroke="#E2B203"/>
  <text x="56" y="380" font-size="16" font-weight="700" fill="#533F04">Lease guard (local)</text>
  <text x="56" y="404" font-size="14" fill="#533F04">Claude Code hooks block edits</text>
  <text x="56" y="424" font-size="14" fill="#533F04">outside the lease; pre-commit</text>
  <text x="56" y="442" font-size="14" fill="#533F04">blocks commits</text>
  <rect x="40" y="466" width="230" height="74" rx="10" fill="#FFF7D6" stroke="#E2B203"/>
  <text x="56" y="494" font-size="16" font-weight="700" fill="#533F04">PR check (CI)</text>
  <text x="56" y="518" font-size="14" fill="#533F04">fails PRs that leave the lease</text>

  <!-- MCP -->
  <rect x="330" y="186" width="190" height="96" rx="10" fill="#E9F2FF" stroke="#1D7AFC"/>
  <text x="346" y="216" font-size="16" font-weight="700" fill="#09326C">Atlassian MCP</text>
  <text x="346" y="240" font-size="14" fill="#09326C">rovo:mcp · OAuth as</text>
  <text x="346" y="260" font-size="14" fill="#09326C">the agent's person</text>
  <line x1="270" y1="232" x2="326" y2="232" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="168" x2="326" y2="210" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="296" x2="326" y2="256" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>

  <!-- Forge app -->
  <rect x="580" y="112" width="330" height="476" rx="14" fill="#F3F0FF" stroke="#6E5DC6" stroke-width="2"/>
  <text x="600" y="144" font-size="18" font-weight="700" fill="#352C63">Lease — Forge app</text>
  <rect x="600" y="160" width="290" height="96" rx="10" fill="#ffffff" stroke="#8F7EE7"/>
  <text x="616" y="186" font-size="15" font-weight="700" fill="#352C63">7 actions = MCP tools</text>
  <text x="616" y="208" font-size="13" fill="#352C63">find-work · claim-work · heartbeat</text>
  <text x="616" y="227" font-size="13" fill="#352C63">release-work · check-paths</text>
  <text x="616" y="246" font-size="13" fill="#352C63">lease-status · agent-report</text>
  <rect x="600" y="270" width="290" height="118" rx="10" fill="#ffffff" stroke="#8F7EE7"/>
  <text x="616" y="296" font-size="15" font-weight="700" fill="#352C63">Lease table</text>
  <text x="616" y="318" font-size="13" fill="#352C63">one Custom Entity record + revision</text>
  <text x="616" y="337" font-size="13" fill="#352C63">conditional transaction = never grants</text>
  <text x="616" y="356" font-size="13" fill="#352C63">the same files twice; exact glob overlap;</text>
  <text x="616" y="375" font-size="13" fill="#352C63">policy per project; need-to-know filter</text>
  <rect x="600" y="402" width="290" height="76" rx="10" fill="#ffffff" stroke="#8F7EE7"/>
  <text x="616" y="428" font-size="15" font-weight="700" fill="#352C63">Triggers</text>
  <text x="616" y="450" font-size="13" fill="#352C63">every 5 min: reclaim silent leases</text>
  <text x="616" y="469" font-size="13" fill="#352C63">issue updated: Done / merged ends holds</text>
  <rect x="600" y="492" width="290" height="76" rx="10" fill="#ffffff" stroke="#8F7EE7"/>
  <text x="616" y="518" font-size="15" font-weight="700" fill="#352C63">Rovo agent "Lease Tower"</text>
  <text x="616" y="540" font-size="13" fill="#352C63">"What did the agents do overnight?"</text>
  <text x="616" y="558" font-size="13" fill="#352C63">read-only actions for supervisors</text>
  <line x1="520" y1="232" x2="596" y2="210" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>

  <!-- Jira surfaces -->
  <text x="970" y="128" font-size="14" font-weight="700" fill="#626F86" letter-spacing="1">IN JIRA, FOR PEOPLE</text>
  <g font-size="14" fill="#164B35">
    <rect x="970" y="142" width="200" height="86" rx="10" fill="#DCFFF1" stroke="#22A06B"/>
    <text x="986" y="168" font-size="15" font-weight="700">Issue panel</text>
    <text x="986" y="190">holder, paths, countdown</text>
    <text x="986" y="210">take back · reserve by hand</text>
    <rect x="970" y="242" width="200" height="86" rx="10" fill="#DCFFF1" stroke="#22A06B"/>
    <text x="986" y="268" font-size="15" font-weight="700">Control tower</text>
    <text x="986" y="290">live leases · 24 h report</text>
    <text x="986" y="310">checker · simulator</text>
    <rect x="970" y="342" width="200" height="66" rx="10" fill="#DCFFF1" stroke="#22A06B"/>
    <text x="986" y="368" font-size="15" font-weight="700">Project settings</text>
    <text x="986" y="390">the project's agent policy</text>
    <rect x="970" y="422" width="200" height="86" rx="10" fill="#DCFFF1" stroke="#22A06B"/>
    <text x="986" y="448" font-size="15" font-weight="700">Work item</text>
    <text x="986" y="470">comments: lease, hand-off,</text>
    <text x="986" y="490">scope check · issue property</text>
  </g>
  <line x1="910" y1="250" x2="966" y2="190" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>
  <line x1="910" y1="300" x2="966" y2="288" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>
  <line x1="910" y1="350" x2="966" y2="372" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>
  <line x1="910" y1="440" x2="966" y2="462" stroke="#44546F" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1070 508 V 636 H 155 V 546" fill="none" stroke="#E2B203" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="470" y="660" font-size="13" fill="#7F5F01">issue property → PR check reads the lease</text>
</svg>
